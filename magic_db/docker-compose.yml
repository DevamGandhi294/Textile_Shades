# PostgreSQL 16 + MinIO for local development.
#   Start:  docker compose -f magic_db/docker-compose.yml up -d
#   Stop:   docker compose -f magic_db/docker-compose.yml down        (data is kept)
#   Wipe:   docker compose -f magic_db/docker-compose.yml down -v     (deletes all data!)
# MinIO web console: http://localhost:9001  (user magicadmin, password magicadmin123)
name: magic-outline

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: magic
      POSTGRES_PASSWORD: magic
      POSTGRES_DB: magic_outline
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magic -d magic_outline"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: magicadmin
      MINIO_ROOT_PASSWORD: magicadmin123
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
